name: Tests

on:
  # Every push to main runs, so each main commit gets a Required checks verdict
  # and Release Drafter, which follows a successful run, sees one.
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its running checks, which no longer
# match its head. Pushes to main wait instead, so every main commit is checked.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Let Corepack download the pinned pnpm without an interactive prompt.
  COREPACK_ENABLE_DOWNLOAD_PROMPT: 0

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      # The tools run inside Bun today (OpenCode's plugin host), so their
      # tests do too.
      - name: Use Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm run format:check
      - name: Typecheck
        run: pnpm run typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm run build
      - name: Smoke test the plugin under Node
        run: pnpm run smoke

  # Loads the built plugin into each OpenCode version the README lists, to
  # catch a change in OpenCode before a person reports it.
  load:
    name: Load into OpenCode ${{ matrix.opencode }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        opencode: ["2.1.2", "2.3.0"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build
      # npm, not pnpm: pnpm may block the install script that picks the binary.
      - name: Install OpenCode ${{ matrix.opencode }}
        run: |
          npm install --no-audit --no-fund --prefix "$RUNNER_TEMP/opencode" "@opencode/cli@${{ matrix.opencode }}"
          test "$("$RUNNER_TEMP/opencode/node_modules/.bin/opencode" --version)" = "opencode v${{ matrix.opencode }}"
      - name: Load the plugin into OpenCode
        run: node scripts/opencode-load.mjs "$RUNNER_TEMP/opencode/node_modules/.bin/opencode" . "$RUNNER_TEMP/opencode-load"

  # The one check the protection of main requires (`repo-kit setup github
  # --required-check`), so jobs can be added or renamed without touching it.
  required:
    name: Required checks
    if: always()
    needs: [check, load]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        env:
          CHECK_RESULT: ${{ needs.check.result }}
          LOAD_RESULT: ${{ needs.load.result }}
        run: |
          if [[ "$CHECK_RESULT" != "success" || "$LOAD_RESULT" != "success" ]]; then
            exit 1
          fi
